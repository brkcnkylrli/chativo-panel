name: Panel imajini derle

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Kaynagi al
        uses: actions/checkout@v4

      - name: Lisans denetimi
        run: |
          if [ -d enterprise ]; then
            echo "::error::enterprise/ dizini geri gelmis"
            exit 1
          fi
          echo "enterprise/ yok - kurulum bastan sona MIT"

      - name: Disk ac
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tail -1
